rules:
  - id: secrets-aws-access-key
    name: AWS Access Key
    severity: high
    category: cloud-credentials
    scanner_type: secrets
    description: AWS access key detected
    fix: Rotate the key and use IAM roles or environment variables
    references:
      - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
    tags:
      - aws
      - credentials
    enabled: true

  - id: secrets-github-token
    name: GitHub Token
    severity: critical
    category: api-token
    scanner_type: secrets
    description: GitHub personal access token detected
    fix: Revoke the token and use GitHub Apps or OAuth flows
    references:
      - https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/creating-a-personal-access-token
    tags:
      - github
      - token
    enabled: true

  - id: secrets-private-key
    name: Private Key
    severity: critical
    category: private-key
    scanner_type: secrets
    description: Private key detected
    fix: Remove the private key and use a secrets manager
    tags:
      - private-key
      - cryptography
    enabled: true
